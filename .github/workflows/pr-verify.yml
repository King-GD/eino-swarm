name: PR verification

# Pull requests into the verification branch only. Drafts are not filtered:
# an unfinished pull request still has to keep the checks green.
on:
  pull_request:
    branches: [ci/verify]

# The workflow can read the checkout and nothing else. No job needs a secret.
permissions:
  contents: read

# A new run supersedes the previous run for the same pull request.
concurrency:
  group: pr-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  phone:
    name: Phone bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull request head, not the synthetic merge commit, so failures
          # name the contributor's own tree.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      # The phone bundle must stand on its own: these checks pass even when no
      # PC frontend install exists anywhere on the runner.
      - name: Assert the PC bundle is absent
        run: test ! -e frontend/node_modules
      - name: Install phone packages
        run: cd mobile && npm ci
      - name: Build phone bundle
        run: cd mobile && npm run build
      - name: Phone unit tests
        run: cd mobile && npm test
      - name: Assert the phone checks did not create the PC bundle
        run: test ! -e frontend/node_modules

  pc-web:
    name: PC/Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `make frontend` builds the bundle through the Go generator.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install frontend packages
        run: cd frontend && npm ci
      - name: Type check
        run: cd frontend && npm run lint
      # Builds dist/ and writes its source stamp. It runs before the unit tests
      # so a bundle regression reports on its own, separate from a test failure.
      - name: Production bundle
        run: make frontend
      - name: Front-end unit tests
        run: cd frontend && npm test

  # The offline browser suite is a separate job so its long run cannot hide the
  # type, bundle and unit results above, and a failing unit test does not stop
  # the browser evidence from being produced.
  pc-web-e2e:
    name: PC/Web offline E2E
    # The suite asserts a macOS settings titlebar (render probe cover) that the
    # baseline asserts under the same platform condition; Linux Chromium cannot
    # produce it. The Intel image also has capacity while macOS ARM is short.
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      # Selects the headless server entry. Playwright's web server inherits it.
      GOFLAGS: "-tags=server"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install frontend packages
        run: cd frontend && npm ci
      # The bundle and its source stamp let the web server serve dist/ rather
      # than rebuild it while the suite is already running.
      - name: Production bundle
        run: make frontend
      # Compile the server entry once, before Playwright starts, so the suite's
      # 180-second web-server start budget is not spent on a cold build. The
      # disposable binary only warms the Go build cache.
      - name: Warm the Go build cache
        run: go build -o "$RUNNER_TEMP/zwai" ./cmd/zwai
      - name: Install the suite browser
        run: cd frontend && npx playwright install chromium
      - name: Offline browser E2E
        run: cd frontend && npm run e2e
      - name: Keep the E2E evidence when the suite fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidence-pr-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # Formatting, vet and a plain compile are their own short job so a style or
  # build regression reports in minutes instead of queueing behind the race
  # lanes. It publishes its own result and gates nothing: every job below keeps
  # running whatever this one says.
  go-static:
    name: Go static and build checks
    # The suite asserts the project's own desktop command set and its macOS
    # update and lockfile behavior, so it uses the untagged macOS build rather
    # than the Linux server variant. Node supplies the frontend entry's
    # toolchain; the macOS image supplies the native libs.
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting
        run: |
          start=$SECONDS
          make fmt-check
          echo "go-static: phase=fmt status=ok duration_s=$((SECONDS-start))"
      - name: Vet
        run: |
          start=$SECONDS
          make vet
          echo "go-static: phase=vet status=ok duration_s=$((SECONDS-start))"
      - name: Compile every package
        run: |
          start=$SECONDS
          go build ./...
          echo "go-static: phase=build status=ok duration_s=$((SECONDS-start))"

  # The race suite is the same untagged macOS build as before, split into four
  # lanes so no lane carries the whole tree: internal/engine alone outgrew one
  # job's budget. `fail-fast: false` keeps a red lane from cancelling the rest,
  # and every lane keeps the original 25-minute package timeout and 60-minute
  # job timeout. pr-verify.md states what each lane owns and how it proves it.
  go-race:
    name: Go race tests (${{ matrix.lane }})
    runs-on: macos-15-intel
    timeout-minutes: 60
    # Both checkouts are siblings under the workspace: the product tree keeps its
    # own root, so the lane driver's checkout can never make the candidate Git
    # tree dirty or change what its build metadata and native tests see.
    defaults:
      run:
        working-directory: candidate
    strategy:
      fail-fast: false
      matrix:
        lane: [engine-a, engine-b, cli, rest]
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull request head, not the synthetic merge commit, so a failure
          # names the contributor's own tree.
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: candidate/frontend/package-lock.json
      # The cli lane restores GOCACHE and GOMODCACHE through the explicit
      # restore/save pair below, so setup-go must not manage them too.
      - uses: actions/setup-go@v7
        with:
          go-version-file: candidate/go.mod
          cache: ${{ matrix.lane != 'cli' }}
          cache-dependency-path: candidate/go.sum
      # The lane driver is read-only CI code, not candidate content: it comes
      # from the revision that owns this workflow file, in its own checkout.
      - name: Obtain the lane driver from the workflow revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: ci-control
          sparse-checkout: .github
          persist-credentials: false
      - name: Resolve the cmd/zwai cache key and paths
        if: matrix.lane == 'cli'
        id: go-cache
        run: |
          {
            echo "primary=go-race-cli-${{ runner.os }}-${{ runner.arch }}-$(go env GOVERSION)-${{ hashFiles('candidate/go.sum') }}-v1"
            echo "gocache=$(go env GOCACHE)"
            echo "gomodcache=$(go env GOMODCACHE)"
          } >> "$GITHUB_OUTPUT"
      # A repeat run of the same pull request reuses the toolchain and
      # dependency cache its first run saved; the cache service scopes entries
      # to the run's own ref, so another pull request cannot consume it.
      - name: Restore the cmd/zwai race build cache
        if: matrix.lane == 'cli'
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.go-cache.outputs.gocache }}
            ${{ steps.go-cache.outputs.gomodcache }}
          key: ${{ steps.go-cache.outputs.primary }}
          restore-keys: |
            go-race-cli-${{ runner.os }}-${{ runner.arch }}-
      # Compiles the binary the cli lane's own wrappers and subprocesses build
      # again, so they start from a warm cache. A failure here is reported and
      # warns, but lets the race run below report its own status.
      - name: Prewarm the cmd/zwai race build
        if: matrix.lane == 'cli'
        id: prewarm
        continue-on-error: true
        working-directory: candidate/cmd/zwai
        run: |
          start=$SECONDS
          status=0
          go build -race -trimpath -o "$RUNNER_TEMP/zwai-race" . || status=$?
          if [ "$status" -eq 0 ]; then
            echo "go-race: lane=cli phase=prewarm status=ok duration_s=$((SECONDS-start))"
          else
            echo "go-race: lane=cli phase=prewarm status=failed duration_s=$((SECONDS-start))"
            echo "::warning title=race prewarm failed::go build -race ./cmd/zwai failed; the race lane still runs and reports its own result"
          fi
          exit "$status"
      # Saved before the tests so a lane that later fails still leaves the next
      # run a warm cache. Only a key miss and an actually successful prewarm may
      # write it: a failed prewarm must never become a cache entry. Best effort,
      # because a run that already owns this key must not turn a green lane red.
      - name: Save the cmd/zwai race build cache
        if: matrix.lane == 'cli' && steps.prewarm.outcome == 'success' && steps.cache-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.go-cache.outputs.gocache }}
            ${{ steps.go-cache.outputs.gomodcache }}
          key: ${{ steps.go-cache.outputs.primary }}
      - name: Race tests (${{ matrix.lane }})
        run: |
          out="$RUNNER_TEMP/go-race-${{ matrix.lane }}"
          start=$SECONDS
          status=0
          python3 "$GITHUB_WORKSPACE/ci-control/.github/ci/go-race.py" "${{ matrix.lane }}" "$out" || status=$?
          echo "go-race: lane=${{ matrix.lane }} phase=job status=$([ "$status" -eq 0 ] && echo ok || echo failed) wall_s=$((SECONDS-start))"
          exit "$status"
      - name: Keep the race evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-race-${{ matrix.lane }}-pr-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/go-race-${{ matrix.lane }}/
          if-no-files-found: warn
          retention-days: 7

  model-check:
    name: Model checks (TLC)
    # Every case runs; a filter, skip or allowed failure would turn the formal
    # checks into decoration. The tool downloads the pinned tla2tools.jar and
    # verifies its SHA-256 itself, so no other action fetches it.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # Each case keeps the tool's default 600-second budget. The explicit out
      # directory is what the failure artifact below collects.
      - name: Run every model case
        run: python3 -u tools/model_check.py --fetch --out "$RUNNER_TEMP/model-check"
      - name: Keep the TLC evidence for a failed case
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: model-check-evidence-pr-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/model-check/**/tlc.out
            ${{ runner.temp }}/model-check/**/case.cfg
          if-no-files-found: ignore
          retention-days: 7

  docs:
    name: Documentation and Python tools
    # macOS supplies the process-identity symbols two tool regressions read.
    # On this ARM64 image the linker ad-hoc signs the test's own freshly built
    # fixtures, which the real-code-signature assertion checks. `go` must also
    # be on PATH for the real-writer compile test, so the Go action is set up
    # here as well.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Documentation and tool checks
        run: make docs-check

  upstream:
    name: Upstream merge check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # merge-tree needs both sides' full history to find the merge bases.
          fetch-depth: 0
          persist-credentials: false
      # Read-only compatibility probe. One fetch serves both the recorded base
      # revision and the comparison, so they cannot name different upstream
      # commits when upstream moves during the run. Nothing is merged, committed
      # or pushed.
      - name: Fetch upstream main and compare trees
        run: |
          git fetch --no-tags https://github.com/LubyRuffy/eino-swarm.git refs/heads/main
          base=$(git rev-parse FETCH_HEAD)
          head=$(git rev-parse HEAD)
          {
            echo "### Compared revisions"
            echo ""
            echo "- candidate head: \`$head\`"
            echo "- upstream base: \`$base\`"
          } > revisions.txt
          cat revisions.txt
          set +e
          git merge-tree --write-tree --name-only "$base" HEAD > merge-tree.txt 2>&1
          status=$?
          set -e
          cat merge-tree.txt
          {
            cat revisions.txt
            echo ""
            echo "### merge-tree exit status"
            echo '```text'
            echo "$status"
            echo '```'
            echo "### merge-tree output"
            echo '```text'
            cat merge-tree.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "merge-tree against upstream main failed (exit $status); see the step summary" >&2
            exit "$status"
          fi
