<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FOFA world map</title></head>
<body>
  <header><strong id="title">Asset collection</strong><p id="phase" role="status"></p><p id="completeness" class="muted"></p></header>
  <main>
    <div class="map-wrap"><svg id="map" role="img" aria-label="World asset distribution and HTTP check results"></svg><p id="empty"></p></div>
    <div class="legend"><div class="ramp"></div><span id="legend-label"></span></div>
    <section class="progress-block"><p id="progress-label"></p><progress id="progress" aria-label="HTTP checks"></progress><p id="counters"></p></section>
    <p id="unmapped" class="muted"></p>
    <section class="detail-block"><button id="clear-filter" type="button">↺</button><strong id="detail-label"></strong><ul id="details"></ul></section>
    <footer>Made with Natural Earth · 5.1.2</footer>
  </main>
</body></html>
